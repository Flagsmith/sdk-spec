# The stack the spec runs against: a real Flagsmith API and the SDK adapter under test.
# The runner itself runs on the host (see README.md).
name: sdk-spec

services:
  postgres:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30

  flagsmith:
    # The Flagsmith version a spec release is verified against.
    image: ${FLAGSMITH_IMAGE:-docker.io/flagsmith/flagsmith:2.276.0}
    command: migrate-and-serve
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
      DJANGO_ALLOWED_HOSTS: '*'
      DJANGO_SECRET_KEY: sdk-spec
      ENVIRONMENT: test
    ports:
      - ${FLAGSMITH_PORT:-8000}:8000
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/liveness/")']
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy

  sdk-adapter:
    image: ${SDK_ADAPTER_IMAGE:-sdk-spec-adapter}
    environment:
      PORT: 8080
    ports:
      - ${SDK_ADAPTER_PORT:-8080}:8080
    depends_on:
      flagsmith:
        condition: service_healthy
