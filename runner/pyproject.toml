[project]
name = "flagsmith-sdk-spec-runner"
version = "0.1.0"
description = "Runs the Flagsmith SDK behavioural spec against an SDK adapter"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider"
markers = [
    "core: Behaviour every SDK must implement",
]
