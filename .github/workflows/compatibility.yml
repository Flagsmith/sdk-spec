# Runs the spec at this commit against every onboarded SDK's default branch.
# On pull requests this shows which SDKs a spec change would break; nightly it
# catches SDK changes that drift from the spec.
name: SDK compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.sdk.name }}
    strategy:
      fail-fast: false
      matrix:
        # SDKs whose spec PR is still open run their feat/sdk-spec branch.
        sdk:
          - name: python
            repository: Flagsmith/flagsmith-python-client
            ref: main
            language: python
            tags: ''
          - name: nodejs
            repository: Flagsmith/flagsmith-nodejs-client
            ref: main
            language: nodejs
            tags: ''
          - name: java
            repository: Flagsmith/flagsmith-java-client
            ref: main
            language: java
            tags: ''
          - name: dotnet
            repository: Flagsmith/flagsmith-dotnet-client
            ref: main
            language: dotnet
            tags: ''
          - name: go
            repository: Flagsmith/flagsmith-go-client
            ref: main
            language: go
            tags: ''
          - name: ruby
            repository: Flagsmith/flagsmith-ruby-client
            ref: main
            language: ruby
            tags: ''
          - name: php
            repository: Flagsmith/flagsmith-php-client
            ref: main
            language: php
            tags: ''
          - name: rust
            repository: Flagsmith/flagsmith-rust-client
            ref: main
            language: rust
            tags: ''
          - name: elixir
            repository: Flagsmith/flagsmith-elixir-client
            ref: main
            language: elixir
            tags: ''
          - name: js-client
            repository: Flagsmith/flagsmith-js-client
            ref: main
            language: nodejs
            tags: ''
          - name: ios
            repository: Flagsmith/flagsmith-ios-client
            ref: main
            language: swift
            tags: ''
          - name: android
            repository: Flagsmith/flagsmith-kotlin-android-client
            ref: feat/sdk-spec
            language: kotlin
            tags: ''
          - name: flutter
            repository: Flagsmith/flagsmith-flutter-client
            ref: feat/sdk-spec
            language: dart
            tags: ''
    uses: ./.github/workflows/run-spec.yml
    with:
      spec-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      spec-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk-repository: ${{ matrix.sdk.repository }}
      sdk-ref: ${{ matrix.sdk.ref }}
      language: ${{ matrix.sdk.language }}
      tags: ${{ matrix.sdk.tags }}
      results-name: sdk-spec-results-${{ matrix.sdk.name }}
